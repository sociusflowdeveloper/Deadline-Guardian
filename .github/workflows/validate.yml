name: Offline prototype checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 1 Nov 2026
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, verified 1 Nov 2026
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run validation and trust-boundary tests
        run: python -m unittest discover -s tests -v
      - name: Scan current source and available local history
        run: python -B scripts/security_check.py --history
      - name: Compile Python source
        run: python -m compileall -q skills/academic-deadline-drift-guard/scripts scripts tests
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
