name: Offline validator

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 1 Nov 2026
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 1 Nov 2026
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run validation and trust-boundary tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m compileall -q skills/academic-deadline-drift-guard/scripts tests
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
